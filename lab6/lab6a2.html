<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=[10,20,30,40,50];
        document.write("array:"+a+"<br/>");
        a.push(60);
        document.write("push:"+a+"<br/>");
        a.pop();
        document.write("pop:"+a+"<br/>");
        a.shift();
        document.write("shift:"+a+"<br/>");
        a.unshift(1,5);
        document.write("unshift:"+a+"<br/>");
        a.splice(1,2);
        document.write("splice:"+a+"<br/>");
        a.sort();
        document.write("sort:"+a+"<br/>");
       
    </script>
</body>
</html>
