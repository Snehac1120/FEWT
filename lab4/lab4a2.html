<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
        let r1=parseInt(prompt("enter no for r1:"));
        let r2=parseInt(prompt("enter no for r2:"));
        let c=0;
        for(let i=r1;i<=r2;i++){
            c=0;
            for(let j=2;j<i;j++){
                if(i%j==0){
                  c++;
                }
            }
            if(c==0){
            document.write("Prime="+i+"<br/>");
        }
        }
        
    </script>
    </body>
</html>
