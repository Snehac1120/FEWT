<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        n=parseInt(prompt("enter a 2 digit num:"));
        rem=n%10;
        n=n/10;
        ans=1;
        for(i=1;i<=n;i++){
            ans=ans*rem;
        }
        document.write(ans);
    </script>
</body>
</html>
