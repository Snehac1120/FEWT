<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        alert("Fibonacci series");
        let n=parseInt(prompt("enter no:"));
        let a=0,b=1,c,i;
        for(i=1;i<=n;i++){
            document.write(a+"<br>");
            c=a+b;
            a=b;
            b=c;
        }
    </script>
</body>
</html>
