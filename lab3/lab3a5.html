<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            alert("Palindrome no or not");
        let n=parseInt(prompt("enter a no:"));
        let ch=n;
        let ans=0;
        while(n>0){
        let rem=n%10;
        ans=ans*10+rem;
        n=parseInt(n/10);
        }
        
        if(ch==ans){
            alert("Palindrome no.");
        }
        else{
            alert("Not Palindrome no.");
        }
    </script>
    </body>
</html>
