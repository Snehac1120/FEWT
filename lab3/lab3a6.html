<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        alert("ARmstrong no or not");
        let cube=1;
        let ans=0;
        let n=parseInt(prompt("enter a no:"));
        let flag=n;
        while(n>0){
        rem=n%10;
        cube=rem*rem*rem;
        ans=ans+cube;
        n=parseInt(n/10);
        }
        if(ans==flag){
            alert("Armstrong no.");
        }
        else{
            alert("Not Armstrong no.");
        }
    </script>
</body>
</html>
