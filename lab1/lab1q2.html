<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            color: orange;
        }
        a:visited{
            color: red;
        }
        p::first-line{
            color:steelblue;
            font-size: larger;
        }
        p::first-letter{
            color:purple;
            font-size: x-small;
        }
        p::selection{
            background-color: yellow;
        }
        p:hover{
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <a href="#">link</a>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Rerum nulla itaque harum necessitatibus distinctio libero inventore, esse non hic repellat.
    </p>
</body>
</html>
