<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  .a1 {
    width: 20vw;
    height: 20vh;
    background-color: red;
  }

  .a1 {
  width: 200px;
  height: 200px;
  animation: a1 3s ease-in-out infinite alternate; 
}


@keyframes a1 {
  0% {
    background-color: red;
    margin: 0;
  }
  25%{
    margin-left: 20vh;
  }
  50%{
    margin-top: 20vh;
    margin-left: 20vh;
  }
  75%{
    margin-left: 0;
    margin-top: 20vh;
  }
  100% {
    background-color: yellow;
    margin: 0;
  }
}




</style>
        
</head>
<body>
    <div class="a1">
    </div>

    
    
</body>
</html>
