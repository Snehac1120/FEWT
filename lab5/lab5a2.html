<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 2. WAP to read an array from the user and sort them in ascending order. (A)
        let n=parseInt(prompt("enter the size."));
        let a=[];
         for(i=0;i<n;i++){
            j=parseInt(prompt("enter a no:"));
            a.push(j);
        }
        document.write("unsorted array="+a+"<br/>");
        for(i=0;i<a.length;i++){
        for(j=i+1;j<a.length;j++){
        if(a[i]>a[j]){        
        swap=a[i];
        a[i]=a[j];
        a[j]=swap;}
      }
    }
        document.write("sorted array:"+a+"<br/>");
    </script>
</body>
</html>
