<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 3. WAP to read an array from the user and sort them using bubble sort. (A)
        let n=parseInt(prompt("enter the size."));
        let a=[];
         for(i=0;i<n;i++){
            j=parseInt(prompt("enter a no:"));
            a.push(j);
        }
        document.write("unsorted array="+a+"<br/>");
        for(i=0;i<n-1;i++){
            for(j=0;j<n-1-i;j++){
                if(a[j]>a[j+1]){
                swap=a[j];
                a[j]=a[j+1];
                a[j+1]=swap;  
                }
            }
        } 
        document.write("sorted array:"+a+"<br/>");
    </script>
</body>
</html>
