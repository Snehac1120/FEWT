<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function print(value){
            document.write("sum="+value);
        }

        function sum(a,b,callback){
            add=a+b;
            callback(add);
        }

        sum(3,5,print);
    </script>
</body>
