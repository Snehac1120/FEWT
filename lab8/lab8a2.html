<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="event">Click to view the event</button>

    <h1 id="click"></h1>
    <script>

        let button=document.getElementById("event");

        let click=document.getElementById("click");

        button.onclick = function(){
            click.innerHTML="Mouse click";
        }

        button.onclose = function(){
            click.innerHTML="Mouse close";
        }

        button.onmousedown = function(){
            click.innerHTML="Mouse down";
        }
        
        
        button.onmouseleave = function(){
            click.innerHTML="Mouse leave";
        }

        button.onmouseover = function(){
            click.innerHTML="Mouse Over";
        }


        button.ondblclick = function(){
            click.innerHTML="Mouse double click";
        }

    
    </script>
</body>
</html>
